name: Build and deploy

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/mmr-bot:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/mmr-bot:latest

      - name: Deploy bot container app
        run: |
          az containerapp update \
            --name mmr-bot \
            --resource-group rg-mmr \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/mmr-bot:latest

      - name: Deploy worker container app
        run: |
          az containerapp update \
            --name mmr-worker \
            --resource-group rg-mmr \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/mmr-bot:latest
